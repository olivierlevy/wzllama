[package]
name = "wzllama"
version = "0.1.0"
edition = "2024"
description = "Wizard CLI pour simplifier l'installation et l'usage d'une stack IA locale"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "5.0"
sysinfo = "0.31"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
dialoguer = "0.11"
colored = "2.1"
which = "6.0"
include_dir = "0.7"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }