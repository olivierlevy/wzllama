[package]
name = "wzllama"
version = "0.2.0"
edition = "2021"
description = "Wizard CLI pour simplifier l'installation et l'usage d'une stack IA locale"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "6.0"
sysinfo = "0.39"
anyhow = "1.0"
chrono = "0.4"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
dialoguer = "0.12"
colored = "3.1"
which = "8.0"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }