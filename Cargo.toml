[package]
name = "wzllama"
version = "0.2.0"
edition = "2021"
description = "Wizard CLI pour simplifier l'installation et l'usage d'une stack IA locale"

[dependencies]
clap = { version = "4.5", features = ["derive"] }                                                                                                                 
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "6.0"
sysinfo = "0.39"
anyhow = "1.0"
chrono = "0.4"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
colored = "3.1"
which = "8.0"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
# TUI with ratatui
ratatui = "0.26"
crossterm = "0.27"
unicode-width = "0.1"
strum = "0.26"
strum_macros = "0.26"
# Unix libc for fork/exec
libc = "0.2"
# Terminal PTY for embedded terminal (optional - for future use)
# tui-term = "0.3"  # Commented out due to enumset_derive incompatibility
# Keep dialoguer for CLI fallback and tools
dialoguer = "0.12"
# HTML scraper for ollama library
scraper = "0.21"
# Model recommendation and hardware detection
llmfit-core = { git = "https://github.com/AlexsJones/llmfit" }