[package]
name = "wzllama"
version = "0.3.0"
edition = "2021"
description = "Wizard CLI for simplifying installation and usage of local AI stack"
license = "MIT"
repository = "https://github.com/olivierlevy/wzllama"
documentation = "https://github.com/olivierlevy/wzllama#readme"
homepage = "https://github.com/olivierlevy/wzllama"
readme = "README.md"
keywords = ["ai", "llm", "ollama", "local-ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }                                                                                                                 
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "6.0"
sysinfo = "0.39"
anyhow = "1.0"
chrono = "0.4"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
colored = "3.1"
which = "8.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
# Unix libc for fork/exec
libc = "0.2"
# Terminal PTY for embedded terminal (optional - for future use)
# tui-term = "0.3"  # Commented out due to enumset_derive incompatibility
# Keep dialoguer for CLI fallback and tools
dialoguer = "0.12"
# HTML scraper for ollama library
scraper = "0.21"
# Model recommendation and hardware detection
llmfit-core = { git = "https://github.com/AlexsJones/llmfit" }