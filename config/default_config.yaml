# Configuration par défaut de wzllama
version: "0.1.0"
language: "auto"  # auto, en, fr, de, es

# Profil de l'utilisateur (rempli par le wizard)
profile:
  usage_type: null
  weight_profile: "default"

# État d'installation
installation:
  ollama: "not_checked"
  open_webui: "not_checked"
  hermes_agent: "not_checked"
  openclaw: "not_checked"

# Paramètres de performance
